[project]
name = "vocos"
version = "0.1.0"
description = "Fourier-based neural vocoder for high-quality audio synthesis"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Hubert Siuzdak", email = "huberts@charactr.com"}
]
dependencies = [
    "einops>=0.8.1",
    "encodec==0.1.1",
    "huggingface-hub>=1.0.1",
    "numpy>=2.3.4",
    "pyyaml>=6.0.3",
    "scipy>=1.16.3",
    "torch>=2.9.0",
    "torchaudio>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/charactr-platform/vocos"
Repository = "https://github.com/charactr-platform/vocos"

[project.optional-dependencies]
train = [
    "fairseq>=0.12.2",
    "jsonargparse[signatures]>=4.42.0",
    "matplotlib>=3.10.7",
    "pesq>=0.0.4",
    "pytorch-lightning==1.8.6",
    "torchcrepe>=0.0.24",
    "transformers>=4.12.2",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"